<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gibson Ranch | Provisions & Wares</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --oatmeal: #f7f3ef;
            --ink: #1a202c;
            --terracotta: #c57b57;
            --sage: #848c72;
            --white: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--oatmeal);
            color: var(--ink);
            line-height: 1.6;
        }

        /* 1. THE TICKER */
        .ticker {
            background-color: var(--ink);
            color: var(--white);
            padding: 8px 0;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* 2. HERO SECTION */
        header {
            padding: 80px 20px;
            text-align: center;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            margin: 0;
            color: var(--ink);
        }
        .subtitle {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.2rem;
            color: var(--terracotta);
            margin-top: 10px;
        }

        /* 3. SECTION STYLING */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            border-bottom: 1px solid #d1d5db;
            padding-bottom: 10px;
            margin-bottom: 30px;
            text-align: left;
        }

        /* 4. THE GRID */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            margin-bottom: 80px;
        }
        .card {
            background: var(--white);
            border-radius: 4px;
            overflow: hidden;
            transition: transform 0.3s ease;
            text-align: left;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        .card:hover {
            transform: translateY(-8px);
        }
        .card-image {
            width: 100%;
            height: 250px;
            background-color: #e2e8f0; /* Placeholder color */
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-style: italic;
        }
        .card-content {
            padding: 25px;
        }
        .card h3 {
            font-family: 'Playfair Display', serif;
            margin: 0 0 10px 0;
            font-size: 1.5rem;
        }
        .price {
            font-weight: 600;
            color: var(--terracotta);
            margin-bottom: 15px;
        }
        .btn {
            display: block;
            text-align: center;
            background-color: var(--ink);
            color: var(--white);
            padding: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 2px;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }

        /* 5. STORY BREAK */
        .story-break {
            background-color: var(--sage);
            color: var(--white);
            padding: 100px 20px;
            text-align: center;
            margin: 60px 0;
        }
        .story-break p {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="ticker">
        Next Bake Day: Saturday | Fresh Dahlias & Zinnias available now
    </div>

    <header>
        <h1>Gibson Ranch</h1>
        <div class="subtitle">Hand-Raised & Home-Baked in Lowell, Indiana</div>
    </header>

        <div class="shop-grid">
            <div class="card">
